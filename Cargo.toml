[package]
name = "english-word-bot"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
default-run = "english-word-bot"

[dependencies]
anyhow = "1"
am-wordlist = "1.1"
bluesky-bot = { git = "https://github.com/ImLunaHey/bluesky-tools-rs", rev = "79695c69e6beb862e46d863a5cd09c7301ae4e31" }
chrono = "0.4"
dotenvy = "0.15"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
static-lang-word-lists = { version = "0.4.2", default-features = false, features = ["lang-en"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
