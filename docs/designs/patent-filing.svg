<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#e9e5da"/><rect x="52" y="42" width="696" height="716" fill="none" stroke="#202020" stroke-width="2"/><rect x="620" y="65" width="90" height="55" fill="none" stroke="#365d76" stroke-width="3"/><text x="76.00" y="78.00" font-size="14.00" font-family="Liberation Mono" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#202020">UNITED STATES LEXICAL PATENT</text><text x="665.00" y="92.00" font-size="13.00" font-family="Liberation Mono" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#365d76">FIG. 1</text><line x1="76" y1="142" x2="724" y2="142" stroke="#365d76"/><text x="76.00" y="175.00" font-size="11.00" font-family="Liberation Mono" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#365d76">PATENT NO. EWB-7644</text><text x="76.00" y="240.00" font-size="58.00" font-family="Liberation Serif" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#202020">serendipity</text><text x="76.00" y="290.00" font-size="13.00" font-family="Liberation Mono" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#365d76">A NOUN PRONOUNCED /ˌsɛrənˈdɪpɪti/</text><text x="76.00" y="355.00" font-size="12.00" font-family="Liberation Mono" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#365d76">ABSTRACT</text><text x="76.00" y="392.00" font-size="16.00" font-family="Liberation Serif" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#202020">The occurrence and development of events by chance in a</text><text x="76.00" y="419.00" font-size="16.00" font-family="Liberation Serif" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#202020">happy or beneficial way.</text><text x="76.00" y="525.00" font-size="12.00" font-family="Liberation Mono" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#365d76">CLAIMS</text><text x="76.00" y="560.00" font-size="15.00" font-family="Liberation Serif" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#202020">1. A word originating in Persian.</text><text x="76.00" y="590.00" font-size="15.00" font-family="Liberation Serif" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#202020">2. The meaning substantially as described above.</text><text x="724.00" y="732.00" font-size="10.00" font-family="Liberation Mono" font-weight="normal" text-anchor="end" dominant-baseline="middle" fill="#365d76">@englishwordbot.bsky.social</text></svg>